<!doctype html><html lang="uz"><head><script src="/locale.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOPSHINALAR | Admin panel</title><style>
@font-face{font-family:Inter;src:url('/assets/inter.ttf')}*{box-sizing:border-box}body{margin:0;font:14px Inter,Arial,sans-serif;background:#f2f2f2;color:#171717}header{background:#0b0b0a;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:20px 5%;gap:20px}header img{width:220px}a{color:inherit}nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}button,.button{cursor:pointer;border:0;border-radius:5px;background:#171717;color:white;padding:13px 18px;font:inherit;text-decoration:none}button.active,.red{background:#e6332a}button:disabled{opacity:.6;cursor:wait}main{max-width:1200px;margin:auto;padding:0 24px 60px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.stat,article,.panel{background:white;padding:24px;border:1px solid #ddd;border-radius:6px}.stat b{display:block;font-size:28px;margin-top:8px}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:25px 0}h1{font-size:28px}h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}article img{width:100%;height:160px;object-fit:contain;background:#eee}article p{color:#666;line-height:1.6}.actions{display:flex;gap:8px;margin-top:18px}.secondary{background:#e8e8e8;color:#171717}.notice{padding:14px 18px;border-left:3px solid #e6332a;background:#fff;margin:20px 0;line-height:1.7}dialog{border:0;border-radius:8px;width:min(700px,94%);max-height:90vh;padding:28px}dialog::backdrop{background:#0009}form label{display:block;font-size:13px;margin:14px 0 6px}input,textarea,select{font:inherit;width:100%;padding:12px;border:1px solid #bbb;border-radius:4px;background:white}textarea{min-height:90px}input[type=checkbox]{width:auto}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.span{grid-column:1/-1}.muted{color:#666}#status{position:sticky;top:0;z-index:5;padding:14px;background:#fff;border:1px solid #ccc;display:none;white-space:pre-wrap}#status.error{border-color:#e6332a;color:#a81812}.inquiry{margin:16px 0}.inquiry pre{white-space:pre-wrap;font:inherit;line-height:1.7}.inquiry select{max-width:220px}.ready{color:#39804c}footer{padding:24px 0;color:#777;font-size:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:14px;font-size:11px}header{padding:16px 20px}header img{width:180px}main{padding:0 16px 40px}h1{font-size:23px}}
.language-switch{display:inline-flex;gap:2px;align-items:center;white-space:nowrap}.language-switch button{font:700 12px Arial,sans-serif;border:1px solid #999;background:transparent;color:inherit;padding:8px;min-width:34px;border-radius:3px;cursor:pointer}.language-switch button.lang-active{background:#E6332A;border-color:#E6332A;color:#fff}html[lang=ru] h1{font-size:clamp(38px,4.7vw,70px)}@media(max-width:480px){header{flex-wrap:wrap}header .logo img{max-width:44vw}header .language-switch{order:4;margin-left:auto}html[lang=ru] .slide-copy h1{font-size:40px}html[lang=ru] h2{font-size:29px}html[lang=ru] .special-options strong{font-size:16px}}</style></head><body><header><img src="/assets/topshinalar-logo-dark.png" alt="TOPSHINALAR"><div><a href="/" target="_blank">Saytni ko‘rish ↗</a> · <a href="/signout-with-chatgpt?return_to=%2F" target="_top">Chiqish</a></div><div class="language-switch" role="group" aria-label="Til / Язык"><button type="button" data-lang="uz" lang="uz">UZ</button><button type="button" data-lang="ru" lang="ru">RU</button></div></header><main><nav><button class="active" data-tab="products">Mahsulotlar</button><button data-tab="banners">Bannerlar</button><button data-tab="inquiries">Mijoz so‘rovlari</button><button data-tab="settings">Sozlamalar</button></nav><div id="status" role="status" aria-live="polite"></div><div class="stats"><div class="stat">Mahsulotlar<b id="productCount">—</b></div><div class="stat">Yangi so‘rovlar<b id="inquiryCount">—</b></div><div class="stat">Faol bannerlar<b id="bannerCount">—</b></div></div><div id="content"><p>Yuklanmoqda…</p></div><footer>TOPSHINALAR · O‘zgarishlar serverda saqlanadi. Rasm formatlari: JPG, PNG, WebP; 5 MB gacha.</footer></main><dialog id="editor"><form id="editForm"><h2 id="editorTitle">Tahrirlash</h2><div class="fields" id="editorFields"></div><p id="editorStatus" role="status" style="color:#a81812"></p><div class="actions"><button class="red" type="submit">Saqlash</button><button type="button" class="secondary" id="cancel">Bekor qilish</button></div></form></dialog><script>
const t=x=>window.TSLocale.t(x);const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data={products:[],banners:[],inquiries:[],settings:[]},tab='products',editId='',editKind='';
async function api(path,opts={}){const r=await fetch('/api/'+path,opts);let j;try{j=await r.json()}catch{throw Error('Server javobi xato. Qayta urinib ko‘ring.')}if(!r.ok)throw Error(j.error||'Server bilan bog‘lanib bo‘lmadi');return j}
function status(t,error=false){$('status').style.display='block';$('status').className=error?'error':'';$('status').textContent=t}
async function load(){try{const values=await Promise.all(Object.keys(data).map(k=>api('admin/'+k)));Object.keys(data).forEach((k,i)=>data[k]=values[i]);$('productCount').textContent=data.products.length;$('inquiryCount').textContent=data.inquiries.filter(x=>x.status==='new').length;$('bannerCount').textContent=data.banners.filter(x=>x.published).length;render()}catch(e){status(e.message,true);$('content').innerHTML='<button id="retry">Qayta yuklash</button>';$('retry').onclick=load}}
function field(k,label,value='',type='text',options){if(type==='checkbox')return `<div class="span"><label><input name="${k}" type="checkbox" ${value?'checked':''}> ${label}</label></div>`;if(type==='textarea')return `<div class="span"><label for="f-${k}">${label}</label><textarea id="f-${k}" name="${k}" maxlength="3000">${esc(value)}</textarea></div>`;if(options)return `<div><label for="f-${k}">${label}</label><select id="f-${k}" name="${k}">${options.map(o=>`<option value="${esc(o)}" ${o===value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;return `<div><label for="f-${k}">${label}</label><input id="f-${k}" name="${k}" type="${type}" value="${esc(value)}" ${['name','size','title'].includes(k)?'required':''} ${type==='number'?'min="0" step="any"':''}></div>`}
function editor(kind,id=''){editId=id;editKind=kind;const x=data[kind].find(x=>x.id===id)||{};$('editorStatus').textContent='';$('editorTitle').textContent=(id?'Tahrirlash':'Yangi qo‘shish');let html='';if(kind==='products'){html=field('name','Mahsulot nomi',x.name)+field('nameRu','Mahsulot nomi (RU)',x.nameRu)+field('brand','Brend',x.brand)+field('size','Shina o‘lchami',x.size)+field('axle','O‘q turi',x.axle||'Universal','text',['Universal','Rul o‘qi','Tortuvchi o‘q','Tirkama o‘qi'])+field('category','Kategoriya',x.category||'Yuk mashinalari','text',['Yuk mashinalari','Maxsus texnika'])+field('vehicle','Texnika turi',x.vehicle)+field('price','Narx (so‘m); bo‘sh bo‘lsa so‘rov asosida',x.price??'','number')+field('stock','Mavjud soni',x.stock||0,'number')+field('sort','Ko‘rsatish tartibi',x.sort||0,'number')+field('description','Tavsif',x.description,'textarea')+field('descriptionRu','Tavsif (RU)',x.descriptionRu,'textarea')+field('vehicleRu','Texnika turi (RU)',x.vehicleRu)+field('published','Saytda ko‘rsatish',x.published||false,'checkbox')}
if(kind==='banners'){html=field('title','Sarlavha',x.title,'textarea')+field('titleRu','Sarlavha (RU)',x.titleRu,'textarea')+field('subtitle','Qisqa matn',x.subtitle,'textarea')+field('subtitleRu','Qisqa matn (RU)',x.subtitleRu,'textarea')+field('sort','Ko‘rsatish tartibi',x.sort||0,'number')+field('published','Faol banner',x.published??true,'checkbox')}
html+=field('image','Rasm manzili (yuklashda avtomatik)',x.image||'')+'<div class="span"><label for="upload">Rasm yuklash</label><input id="upload" type="file" accept="image/png,image/jpeg,image/webp"><p class="muted" id="uploadStatus"></p></div>';$('editorFields').innerHTML=html+'<p class="span muted">Ruscha maydon bo‘sh qolsa, o‘zbekcha matn ko‘rsatiladi.</p>';$('editor').showModal();$('upload').onchange=upload;}
async function upload(){const file=$('upload').files[0];if(!file)return;const submit=$('editForm').querySelector('[type=submit]');submit.disabled=true;$('uploadStatus').textContent='Yuklanmoqda…';try{const form=new FormData();form.append('file',file);const r=await api('upload',{method:'POST',body:form});$('f-image').value=r.url;$('uploadStatus').textContent='Rasm yuklandi ✓'}catch(e){$('uploadStatus').textContent=e.message}finally{submit.disabled=false}}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='products'||tab==='banners'){const list=data[tab];$('content').innerHTML=`<div class="heading"><h1>${tab==='products'?'Mahsulotlar katalogi':'Bosh sahifa bannerlari'}</h1><button class="red" id="new">+ Yangi qo‘shish</button></div>${!list.length?`<div class="notice">${tab==='products'?'Hozircha mahsulot yo‘q. Haqiqiy mahsulotlarni qo‘shing va “Saytda ko‘rsatish”ni belgilang.':'Standart karier va magistral bannerlari ishlamoqda. Ularni boshqarish uchun quyidagi tugmani bosing.'}</div>${tab==='banners'?'<button id="importBanners">Standart bannerlarni boshqaruvga qo‘shish</button>':''}`:''}<div class="grid">${list.map(x=>`<article>${x.image?`<img src="${esc(x.image)}" alt="${esc(x.name||x.title)}">`:''}<h2 data-no-i18n>${esc(x.name||x.title)}</h2><p data-no-i18n>${esc(x.size||x.subtitle||'')}</p><p>${x.published?'● Saytda ko‘rinadi':'○ Qoralama'}${tab==='products'?' · '+(x.price==null?'Narx so‘rov asosida':Number(x.price).toLocaleString('uz-UZ')+' so‘m')+' · '+x.stock+' dona':''}</p><div class="actions"><button data-edit="${esc(x.id)}">Tahrirlash</button><button class="secondary" data-delete="${esc(x.id)}">O‘chirish</button></div></article>`).join('')}</div>`;$('new').onclick=()=>editor(tab);document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editor(tab,b.dataset.edit));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm(t('Ushbu yozuv o‘chirilsinmi?')))return;try{await api('admin/'+tab+'?id='+encodeURIComponent(b.dataset.delete),{method:'DELETE'});await load();status('O‘chirildi')}catch(e){status(e.message,true)}});if($('importBanners'))$('importBanners').onclick=async()=>{try{for(const b of [{id:'quarry',title:'Og‘ir texnika. Katta imkoniyat.',subtitle:'Karier va maxsus texnika uchun shinalar',image:'/assets/quarry.webp',published:true,sort:0},{id:'highway',title:'Ishonch har bir kilometrda.',subtitle:'Magistral tashuvlar uchun shinalar',image:'/assets/highway.webp',published:true,sort:1}])await api('admin/banners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});await load();status('Standart bannerlar qo‘shildi')}catch(e){status(e.message,true)}};}
if(tab==='inquiries'){$('content').innerHTML='<div class="heading"><h1>Mijoz so‘rovlari</h1><button id="refresh">Yangilash</button></div>'+(!data.inquiries.length?'<div class="notice">Hozircha so‘rov yo‘q. Saytdan yuborilgan so‘rovlar shu yerga keladi.</div>':data.inquiries.map(x=>`<article class="inquiry"><b data-no-i18n>${esc(x.name)}</b> · <a href="tel:${esc(x.phone.replace(/[^+0-9]/g,''))}">${esc(x.phone)}</a><p>${esc(new Date(x.createdAt).toLocaleString(window.TSLocale.lang==='ru'?'ru-RU':'uz-UZ'))}</p><pre data-no-i18n>${esc((x.products||[]).join('\n'))}\n${esc(x.message)}</pre><label>Holati <select data-inquiry="${esc(x.id)}">${[['new','Yangi'],['contacted','Bog‘lanildi'],['done','Yakunlandi']].map(([v,t])=>`<option value="${v}" ${x.status===v?'selected':''}>${t}</option>`).join('')}</select></label></article>`).join(''));$('refresh').onclick=load;document.querySelectorAll('[data-inquiry]').forEach(b=>b.onchange=async()=>{try{await api('admin/inquiries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:b.dataset.inquiry,status:b.value})});await load();status('Holat saqlandi')}catch(e){status(e.message,true)}})}
if(tab==='settings'){const x=data.settings[0]||{};$('content').innerHTML='<h1>Kompaniya ma’lumotlari</h1><div class="notice">Telefon va manzil kiritilgach, mijozlar ularni saytda ko‘radi. So‘rovlar admin panelda saqlanadi.</div><form id="settingsForm" class="panel"><div class="fields">'+field('company','Kompaniya nomi',x.company||'TOPSHINALAR')+field('phone','Telefon',x.phone)+field('telegram','Telegram havolasi: https://t.me/nom',x.telegram)+field('email','E-mail',x.email,'email')+field('address','Manzil',x.address)+field('hours','Ish vaqti',x.hours)+field('about','Kompaniya haqida',x.about,'textarea')+field('aboutRu','Kompaniya haqida (RU)',x.aboutRu,'textarea')+field('addressRu','Manzil (RU)',x.addressRu)+field('hoursRu','Ish vaqti (RU)',x.hoursRu)+'</div><div class="actions"><button class="red">Sozlamalarni saqlash</button></div></form>';$('settingsForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{await api('admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load();status('Sozlamalar saqlandi ✓')}catch(e){status(e.message,true)}finally{b.disabled=false}};}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('cancel').onclick=()=>$('editor').close();$('editForm').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('[type=submit]');b.disabled=true;try{const value=Object.fromEntries(new FormData(e.target));value.id=editId;value.published=e.target.elements.published.checked;await api('admin/'+editKind,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)});$('editor').close();await load();status('Saqlandi ✓')}catch(e){$('editorStatus').textContent=e.message;status(e.message,true)}finally{b.disabled=false}};document.addEventListener('ts-language',()=>{if(!$('editor').open)render()});load();
</script></body></html>
